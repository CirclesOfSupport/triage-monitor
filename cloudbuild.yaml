# This file is NOT what builds or deploys the service. The continuous-deployment
# trigger was created by the Cloud Run "Connect repository" flow and runs its own
# inline build config (Dockerfile build, push, deploy) on every push to main.
# The file is kept to match the other service repos and for a manual build.
# Memory, timeout and env vars are set on the Cloud Run revision with
# gcloud run services update, never here.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east1-docker.pkg.dev/$PROJECT_ID/webhook-repo/triage-monitor:$COMMIT_SHA
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east1-docker.pkg.dev/$PROJECT_ID/webhook-repo/triage-monitor:$COMMIT_SHA
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - triage-monitor
      - --image=us-east1-docker.pkg.dev/$PROJECT_ID/webhook-repo/triage-monitor:$COMMIT_SHA
      - --region=us-east1
      - --no-allow-unauthenticated
images:
  - us-east1-docker.pkg.dev/$PROJECT_ID/webhook-repo/triage-monitor:$COMMIT_SHA
